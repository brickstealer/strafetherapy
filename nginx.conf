server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types for 3D GLTF models and SVG
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
        image/svg+xml     svg svgz;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml model/gltf-binary model/gltf+json;

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
